<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="320" height="320" role="img" aria-label="Metria — la casa si costruisce">
  <title>Metria — la casa si costruisce (liquido · tetto · stella)</title>
  <defs>
    <filter id="fg" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="0.5"/></filter>
    <mask id="lq" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="-2" y="6" width="36" height="30">
      <g filter="url(#fg)"><path class="ld-liq" fill="#fff" d="M-4 23.2 Q0 22.5 4 23.1 Q8 23.7 12 22.9 Q16 22.3 20 23.1 Q24 23.9 28 23.0 Q32 22.2 36 23.0 L36 44 L-4 44 Z"/></g>
    </mask>
  </defs>
  <style>
    @keyframes ldLiq { 0%,5%{transform:translateY(0)} 24%{transform:translateY(-13px)} 88%{transform:translateY(-13px)} 94%{transform:translateY(0)} 100%{transform:translateY(0)} }
    @keyframes ldRoof { 0%,14.5%{transform:translateY(-11px);opacity:0;animation-timing-function:cubic-bezier(.5,.06,.3,1)} 18.5%{opacity:1} 28.5%{transform:translateY(0);opacity:1} 88%{transform:translateY(0);opacity:1} 94%{opacity:0;transform:translateY(0)} 100%{opacity:0;transform:translateY(-11px)} }
    @keyframes ldHouse { 0%,88%{opacity:1} 94%{opacity:0} 100%{opacity:0} }
    @keyframes ldStar {
      0%,30.5%{transform:translate(16px,17.6px) scale(1.4);opacity:0;animation-timing-function:cubic-bezier(.2,.9,.3,1)}
      33.5%{opacity:1}
      38.5%{transform:translate(16px,17.6px) scale(5.1);animation-timing-function:cubic-bezier(.4,.1,.45,1)}
      41.5%{transform:translate(16px,17.6px) scale(3.9);animation-timing-function:cubic-bezier(.35,.1,.45,1)}
      44.5%{transform:translate(16px,17.6px) scale(4.08)}
      88%{opacity:1}
      94%{opacity:0}
      100%{transform:translate(16px,17.6px) scale(1.4);opacity:0}
    }
    .ld-liq{animation:ldLiq 8s cubic-bezier(.55,.03,.35,1) infinite}
    .ld-roof{animation:ldRoof 8s cubic-bezier(.5,.06,.3,1) infinite}
    .ld-house{animation:ldHouse 8s linear infinite}
    .ld-star{animation:ldStar 8s cubic-bezier(.3,1.2,.4,1) infinite}
  </style>
  <g class="ld-house">
    <g mask="url(#lq)" fill="none" stroke-linecap="butt" stroke-linejoin="miter">
      <path d="M10.5 12.75 V22.5 H21.5 V12.75" stroke="#F3ECDD" stroke-width="1.35"/>
      <path d="M8.9 23.2 Q9.65 22.4 9.58 21.5 L11.42 21.5 Q11.35 22.4 12.1 23.2 Z" fill="#F3ECDD"/>
      <path d="M23.1 23.2 Q22.35 22.4 22.42 21.5 L20.58 21.5 Q20.65 22.4 19.9 23.2 Z" fill="#F3ECDD"/>
    </g>
    <path class="ld-roof" d="M5.67 15.5 Q11 12.1 16 6.89 Q21 12.1 26.33 15.5 L23.67 15.5 Q19.57 11.95 16 9.11 Q12.43 11.95 8.33 15.5 Z" fill="#C1694F"/>
  </g>
  <path class="ld-star" d="M0 -1 Q0.26 -0.26 1 0 Q0.26 0.26 0 1 Q-0.26 0.26 -1 0 Q-0.26 -0.26 0 -1 Z" fill="#C1694F"/>
</svg>
